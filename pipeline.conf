# ============================================================
#  BioSpliceView pipeline configuration - FULL mode
#  (transcriptome + proteomics closed loop, Stage 1-5)
#
#  Notes : parameters not listed fall back to the built-in reference
#          defaults. See README ("Parameters") for the full reference.
#  Usage : bash run_pipeline.sh <this-file>
# ============================================================

# ---- already-installed software ----
# Fill in a path and the pipeline uses that binary as-is
# (no download / no install for the tools you list here).
# Leave a tool commented out and it is installed automatically.
#rmats_py=/home/user/envs/bsv-pipeline/bin/rmats.py
#star_bin=/home/user/envs/bsv-pipeline/bin/STAR
#diann_bin=/home/user/diann/diann-linux

# ---- paths (same species & genome build throughout) ----
work_dir=/mnt/g/bioinfo/RNAsplicing/sptest/workspace      # output root (created automatically)
gtf=/mnt/g/bioinfo/refer/Allgtf/gencode.vM39.primary_assembly.annotation.gtf
genome_fa=/mnt/g/bioinfo/refer/Allgtf/GRCm39.primary_assembly.genome.fa
fastq_dir=/mnt/g/bioinfo/RNAsplicing/IL10/renamed_fastq   # samples auto-paired by <group>[-_]*R1*
ms_dir=/home/rm/IL10                                  # MS raw data (.d/.raw found by group prefix)

# ---- mode / general ----
mode=full                   # full | splicing (script default: splicing; env PIPELINE_MODE wins)
threads=8
job_id=IL10KO               # prefix for all output files

# ---- groups (name = sample filename prefix) ----
group1=WT                   # control (rMATS batch 1)
group2=KO                   # treatment (rMATS batch 2)

# ---- rMATS ----
read_type=paired            # paired | single
read_length=150

# ---- BioSpliceView event filters (Stage 2) ----
fdr=0.05                    # event FDR cutoff
psi=0.05                    # |dPSI| cutoff
minjc=10                    # minimum junction count

# ---- search database (Stage 3) ----
species=mouse               # mouse | human; background proteome auto-downloaded
min_aa=10                   # min splice-protein length (aa)

# ---- DIA-NN (Stage 4; pinned 2.6.1) ----
# Full DIA-NN tuning flags - passed verbatim to BOTH commands (4a library
# + 4b search); the pipeline appends the file arguments (--fasta/--lib/
# --f/--out-lib/--out) after them, plus --matrices on the search pass
# (required for report.pr_matrix.tsv) unless already present. DDA data:
# add --dda to the string.
# Quantitative timsTOF (Bruker .d) data: DIA-NN advises appending
# --reanalyse (match between runs) and --mass-acc-ms1/--mass-acc 10-15 ppm (MS1 = --mass-acc-ms1, MS2 fragments = --mass-acc; note: there is no --mass-acc-frag).
diann_params="--threads 16 --verbose 1 --qvalue 0.01 --semi --rt-profiling --direct-quant --ids-to-names --min-pep-len 7 --max-pep-len 30 --min-pr-mz 300 --max-pr-mz 1800 --dda --min-pr-charge 1 --max-pr-charge 4 --min-fr-mz 200 --max-fr-mz 1800 --cut K*,R* --missed-cleavages 1 --unimod4 --met-excision"

# DIA data example - comment the line above and uncomment this one (no --dda):
#diann_params="--threads 8 --verbose 1 --qvalue 0.01 --semi --rt-profiling --direct-quant --ids-to-names --min-pep-len 7 --max-pep-len 30 --min-pr-mz 300 --max-pr-mz 1800 --min-pr-charge 1 --max-pr-charge 4 --min-fr-mz 200 --max-fr-mz 1800 --cut K*,R* --missed-cleavages 1 --unimod4 --met-excision"

# ---- splice-peptide summary (Stage 5) ----
p_cutoff=0.05               # nominal p threshold (exploratory, uncorrected)
